name: Automated Shorts Pipeline

on:
  schedule:
    # 3 scheduled runs per day (UTC): 03:30, 08:30, 13:30 (approx 09:00, 14:00, 19:00 IST)
    - cron: '30 3 * * *'
    - cron: '30 8 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Pipeline Action'
        required: true
        default: 'batch_generate'
        type: choice
        options:
          - batch_generate
          - publish_next_approved
          - generate_single
      topic:
        description: 'Custom topic (if generate_single selected)'
        required: false
        default: 'The Mary Celeste: a ship found sailing with nobody on board'

# Never let two runs (e.g. a cron publish and a manual one) pick the same approved video.
concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline Action
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_BUCKET: shorts
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          # Passed via env, not interpolated into the script, to avoid shell injection.
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_TOPIC: ${{ inputs.topic }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Running scheduled publisher for approved videos..."
            python run_pipeline.py --mode publish
          elif [ "$INPUT_ACTION" = "batch_generate" ]; then
            echo "Running batch generation for 3 videos..."
            python run_pipeline.py --mode batch
          elif [ "$INPUT_ACTION" = "publish_next_approved" ]; then
            echo "Publishing next approved video..."
            python run_pipeline.py --mode publish
          elif [ "$INPUT_ACTION" = "generate_single" ]; then
            echo "Generating single short for topic: $INPUT_TOPIC"
            python run_pipeline.py --mode generate --topic "$INPUT_TOPIC"
          fi

      - name: Upload Video Artifacts for Morning Review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: ignore
